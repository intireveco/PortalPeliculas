{% extends 'peliculas/base.html' %}
{% block titulo %}Ingresar · Portal de Películas{% endblock %}

{% block contenido %}
<div class="caja-formulario">
    <h1>Ingresar</h1>
    {% if form.errors %}
        <div class="mensaje mensaje-error">Usuario o contraseña incorrectos.</div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="boton">Entrar</button>
    </form>
    <p>¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a></p>
</div>
{% endblock %}
