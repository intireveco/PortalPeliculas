{% extends 'peliculas/base.html' %}
{% block titulo %}Registro · Portal de Películas{% endblock %}

{% block contenido %}
<div class="caja-formulario">
    <h1>Crear cuenta</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="boton">Registrarme</button>
    </form>
    <p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Ingresa aquí</a></p>
</div>
{% endblock %}
